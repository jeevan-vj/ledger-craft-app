# Strict discovery flow. A missed required step fails the run.
# optional: true is only for system UI whose labels vary by Android image
# (permission dialogs, the photo picker, keyboard dismissal, and the share target).
# The app is a standalone release APK. EXPO_PUBLIC_API_URL is http://10.0.2.2:3001.
appId: com.easybizinvoice.app
name: Owner signup through invoice PDF
env:
  OWNER_EMAIL: maestro.owner@example.test
  OWNER_PASSWORD: Maestro-pass-1
---
- addMedia:
    - "assets/logo.png"
- launchApp:
    clearState: true
- takeScreenshot: 01-launched
# Fail immediately if this binary is still the Expo development launcher.
- extendedWaitUntil:
    timeout: 45000
    visible:
      text: "Create an account|Development Build"
- assertNotVisible: "Development Build"
- assertNotVisible: "npx expo start"
- assertVisible:
    id: "intro-create-account"
- takeScreenshot: 02-signup-entry
- tapOn:
    id: "intro-create-account"
- extendedWaitUntil:
    timeout: 15000
    visible:
      id: "signup-full-name"
- takeScreenshot: 03-signup-name
- tapOn:
    id: "signup-full-name"
- inputText: "Maestro Owner"
- hideKeyboard:
    optional: true
    label: "Environment-dependent keyboard dismissal"
- tapOn:
    id: "signup-continue"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "signup-phone"
- tapOn:
    id: "signup-phone"
- inputText: "+64210001111"
- hideKeyboard:
    optional: true
    label: "Environment-dependent keyboard dismissal"
- tapOn:
    id: "signup-continue"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "signup-email"
- takeScreenshot: 04-signup-email
- tapOn:
    id: "signup-email"
- inputText: ${typeof MAESTRO_OWNER_EMAIL !== 'undefined' ? MAESTRO_OWNER_EMAIL : OWNER_EMAIL}
- hideKeyboard:
    optional: true
    label: "Environment-dependent keyboard dismissal"
- tapOn:
    id: "signup-continue"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "signup-password"
- tapOn:
    id: "signup-password"
- inputText: ${OWNER_PASSWORD}
- hideKeyboard:
    optional: true
    label: "Environment-dependent keyboard dismissal"
- tapOn:
    id: "signup-terms"
- tapOn:
    id: "signup-continue"
- extendedWaitUntil:
    timeout: 30000
    visible:
      id: "onboarding-business-name"
- takeScreenshot: 05-signup-succeeded
- tapOn:
    id: "onboarding-business-name"
- inputText: "Kauri Discovery Ltd"
- hideKeyboard:
    optional: true
    label: "Environment-dependent keyboard dismissal"
- tapOn:
    id: "onboarding-continue"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "onboarding-country"
- takeScreenshot: 06-onboarding-country
- tapOn:
    id: "onboarding-continue"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "onboarding-gst-yes"
- takeScreenshot: 07-onboarding-gst
- tapOn:
    id: "onboarding-gst-yes"
- tapOn:
    id: "onboarding-continue"
- extendedWaitUntil:
    timeout: 30000
    visible: "New invoice"
- takeScreenshot: 08-home
- tapOn: "More"
- extendedWaitUntil:
    timeout: 15000
    visible:
      id: "more-BusinessSettings"
- takeScreenshot: 09-more
- tapOn:
    id: "more-BusinessSettings"
- extendedWaitUntil:
    timeout: 20000
    visible:
      id: "business-logo"
- takeScreenshot: 10-business-profile
- tapOn:
    id: "business-logo"
- repeat:
    times: 3
    commands:
      - tapOn:
          text: "Allow"
          optional: true
          label: "Environment-dependent permission dialog"
      - tapOn:
          text: "While using the app"
          optional: true
          label: "Environment-dependent permission dialog"
      - tapOn:
          text: "Allow all"
          optional: true
          label: "Environment-dependent permission dialog"
- assertVisible: "Gallery"
- takeScreenshot: 11-logo-chooser
- tapOn: "Gallery"
- tapOn:
    text: "logo.png"
    optional: true
    label: "Environment-dependent photo picker row"
- tapOn:
    text: "logo"
    optional: true
    label: "Environment-dependent photo picker row"
- tapOn:
    text: "Crop"
    optional: true
    label: "Environment-dependent image crop confirm"
- tapOn:
    text: "Done"
    optional: true
    label: "Environment-dependent picker confirm"
- assertNotVisible: "Tap to upload"
- takeScreenshot: 12-logo-selected
- scrollUntilVisible:
    element:
      id: "business-tax-id"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "business-tax-id"
- eraseText
- inputText: "123-456-789"
- hideKeyboard:
    optional: true
    label: "Environment-dependent keyboard dismissal"
- scrollUntilVisible:
