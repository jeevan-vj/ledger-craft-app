name: Verification evidence (experimental)
# Opt-in until isolated database and baseline-compatible gates are complete.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify changed areas (experimental)
        env:
          VERIFY_BASE: origin/main
        run: node scripts/verification/cli.mjs fast
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: artifacts/verification/
          retention-days: 3
          if-no-files-found: warn
