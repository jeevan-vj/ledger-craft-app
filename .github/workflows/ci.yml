name: CI

# Pull requests and pushes to main.
# This workflow does not start Postgres, deploy, or read production secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-lint:
    name: Web lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No `version:` input. package.json packageManager is pnpm@11.19.0.
      # Pinning a version (the old workflow pinned 9) makes pnpm/action-setup
      # fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint is error-free. Any new error fails this job directly.
      # Warnings remain visible; rules and the warning policy are unchanged.
      - name: Lint
        run: pnpm lint

  web-typecheck:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Root `tsc --noEmit` checks nothing: tsconfig.json has `"files": []`
      # and no `--build`. Check the Vite app and the Node config instead.
      # Either project compiler failure blocks CI directly.
      - name: Typecheck
        run: |
          pnpm exec tsc --noEmit -p tsconfig.app.json --pretty false
          pnpm exec tsc --noEmit -p tsconfig.node.json --pretty false

  web-test:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:run

  # Node 24 matches the API runtime in release.yml. pnpm version comes from
  # package.json packageManager; do not pass a version input to action-setup.
  api-contracts:
    name: API & contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API tests, contracts, and typecheck
        run: pnpm test:api && pnpm test:contracts && pnpm type-check:api

  # Node's built-in test runner only. No pnpm install: the readiness and parity
  # checkers use Node built-ins. Report mode exposes open parity work without
  # turning normal CI red; strict mode is reserved for parity release enforcement.
  release-readiness:
    name: Release readiness script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release checker tests
        run: node --test .github/scripts/verify-api-readiness.test.mjs .github/scripts/verify-web-quality-gates.test.mjs scripts/upload-api-sourcemaps.test.mjs scripts/verify-akaunting-core.test.mjs
      - name: Web source map upload checker
        run: node --test scripts/upload-web-sourcemaps.test.mjs
      - name: Akaunting core parity report
        run: node scripts/verify-akaunting-core.mjs --report

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      # Measured 2026-10-21 on main: 0 ESLint errors (warnings remain),
      # 0 tsc errors, and 0 Jest failures. These steps fail the job.
      # Mobile and web checks both fail directly on a nonzero tool exit.
      # Warnings remain visible; no error-count allowance is used.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Test
        run: npm test -- --ci --watchAll=false

      - name: Export iOS bundle
        env:
          EXPO_NO_TELEMETRY: '1'
          # EAS builds upload source maps only when SENTRY_AUTH_TOKEN is set.
          # This export must stay a local bundle.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-ios"
