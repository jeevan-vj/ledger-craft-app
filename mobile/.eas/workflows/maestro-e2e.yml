# Future EAS Maestro job. workflow_dispatch only, so a push does not start a paid build.
# Do not wire this into .github/workflows/ci.yml.
# EXPO_TOKEN was not available in the discovery environment. Do not invent one.
#
# Both platforms use the non-production e2e profile in eas.json: standalone
# (developmentClient false, JS embedded), E2E_BUILD=1 so expo-updates is off,
# Android APK for the emulator and an iOS simulator build. Each Maestro job signs
# up a distinct e2e account (MAESTRO_OWNER_EMAIL) on resend.dev's test domain.
#
# Run from mobile/:
# npx --yes eas-cli@25.3.0 workflow:run .eas/workflows/maestro-e2e.yml
name: Maestro end to end

on:
  workflow_dispatch: {}

jobs:
  build_android:
    name: Android APK for emulator
    type: build
    params:
      platform: android
      profile: e2e
  maestro_android:
    name: Android emulator
    needs: [build_android]
    type: maestro
    runs_on: linux-medium-nested-virtualization
    env:
      MAESTRO_OWNER_EMAIL: delivered+e2e-android-202611031222@resend.dev
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path:
        - .maestro/owner-signup-invoice.yaml
  build_ios:
    name: iOS simulator build
    type: build
    params:
      platform: ios
      profile: e2e
  maestro_ios:
    name: iOS simulator
    needs: [build_ios]
    type: maestro
    runs_on: macos-medium
    env:
      MAESTRO_OWNER_EMAIL: delivered+e2e-ios-202611031222@resend.dev
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path:
        - .maestro/owner-signup-invoice.yaml
