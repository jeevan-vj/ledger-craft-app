# Repository labels for the software factory.
# .github/workflows/labels.yml syncs this file.
# Labels that are not listed here are left in place.
#
# GitHub limits a label description to 100 characters.
# The full risk:high rule is in docs/PIPELINE.md. The pull request template points at that list.
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken or incorrect."
- name: "type:feature"
  color: "1d76db"
  description: "New behaviour, or a spec for an agent to build."
- name: "type:chore"
  color: "cfd3d7"
  description: "Maintenance that does not change product behaviour."
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only."
- name: "type:refactor"
  color: "5319e7"
  description: "Restructure with the same product behaviour."

- name: "area:web"
  color: "0052cc"
  description: "Vite web app under src/."
- name: "area:api"
  color: "0e8a16"
  description: "Hono API under api/."
- name: "area:mobile"
  color: "e99695"
  description: "Expo app under mobile/."
- name: "area:contracts"
  color: "bfd4f2"
  description: "Shared Zod DTOs in packages/contracts."
- name: "area:ci"
  color: "fbca04"
  description: "GitHub Actions, CI scripts, and the label sync."
- name: "area:infra"
  color: "006b75"
  description: "Cloudflare, Wrangler, Pages, and deploy config."

- name: "priority:p0"
  color: "b60205"
  description: "Production is broken or data is at risk."
- name: "priority:p1"
  color: "d93f0b"
  description: "Blocks a release or a user workflow."
- name: "priority:p2"
  color: "fef2c0"
  description: "Normal work. Schedule it with the rest of the queue."
- name: "priority:p3"
  color: "c5def5"
  description: "Can wait."

- name: "size:xs"
  color: "eeeeee"
  description: "A few lines in one file."
- name: "size:s"
  color: "cccccc"
  description: "One module, with a clear change."
- name: "size:m"
  color: "999999"
  description: "A few modules."
- name: "size:l"
  color: "666666"
  description: "Crosses packages or needs a design pass."
- name: "size:xl"
  color: "333333"
  description: "Split this before an agent builds it."

- name: "risk:low"
  color: "216e39"
  description: "No high-risk path. Auto-merge still needs every PIPELINE stage-6 gate."
- name: "risk:medium"
  color: "e36209"
  description: "Behaviour change that does not match a high-risk rule. A person merges it."
- name: "risk:high"
  color: "cb2431"
  description: "HIGH: migrations/Drizzle, money/GST/invoice/quote math, auth, workflows/release, secrets, major deps"

- name: "spec-ready"
  color: "c2e0c6"
  description: "The spec is complete enough for an agent to implement."
- name: "agent:building"
  color: "fff2cc"
  description: "An agent is implementing this now."
- name: "agent:review"
  color: "d4c5f9"
  description: "Implementation is ready for an independent review."
- name: "review-passed"
  color: "28a745"
  description: "Independent review passed."
- name: "needs-human"
  color: "f9d0c4"
  description: "A person has to decide before this continues."
- name: "auto-merge-eligible"
  color: "0366d6"
  description: "Every PIPELINE.md stage-6 gate holds. Review and risk:low are not enough."
