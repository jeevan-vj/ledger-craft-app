      id: "business-save"
    direction: DOWN
    timeout: 15000
- takeScreenshot: 13-business-before-save
- tapOn:
    id: "business-save"
- extendedWaitUntil:
    timeout: 20000
    visible: "Business profile updated successfully"
- takeScreenshot: 14-business-saved
- tapOn: "OK"
- tapOn:
    id: "business-tab-currency"
- extendedWaitUntil:
