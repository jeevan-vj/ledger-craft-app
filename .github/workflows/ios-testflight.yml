name: iOS TestFlight

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
  workflow_dispatch:

# A new push to the same ref cancels the in-progress job so production
# builds do not queue up. An EAS build already handed off with --no-wait
# keeps running on Expo.
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    name: Build and submit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and auto-submit iOS
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
