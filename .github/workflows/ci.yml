name: CI

# Pull requests and pushes to main.
# This workflow does not start Postgres, deploy, or read production secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-lint:
    name: Web lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No `version:` input. package.json packageManager is pnpm@11.19.0.
      # Pinning a version (the old workflow pinned 9) makes pnpm/action-setup
      # fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` (`eslint .` from the repo root) is not clean. The ceiling
      # for errors and warnings is .github/lint-baseline.json (key "web").
      # This step prints the report. The next step fails the job when either
      # count rises. Lower the JSON after a real cleanup. Do not blanket-ignore
      # rules. The api package has no lint script; files it owns are included
      # here only when the root eslint config matches them.
      - name: Lint
        run: |
          set +e
          pnpm lint > "$RUNNER_TEMP/web-lint.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/web-lint.txt"
          echo "$status" > "$RUNNER_TEMP/web-lint.exit"
          exit 0

      - name: Lint baseline
        if: always()
        run: node .github/scripts/ci-baseline-gate.mjs eslint "$RUNNER_TEMP/web-lint.txt" .github/lint-baseline.json web "$(cat "$RUNNER_TEMP/web-lint.exit")"

  web-typecheck:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Root `tsc --noEmit` checks nothing: tsconfig.json has `"files": []`
      # and no `--build`. Check the Vite app and the Node config instead.
      # TODO: tsconfig.app.json is not clean (baseline 728 errors, recorded
      # 2026-10-17). tsconfig.node.json is clean and still runs when the app
      # project fails. Mostly query-builder calls on the Supabase stub
      # (TS2554 / TS2349) in src/services.
      - name: Typecheck
        continue-on-error: true
        run: |
          set +e
          : > "$RUNNER_TEMP/web-tsc.txt"
          pnpm exec tsc --noEmit -p tsconfig.app.json --pretty false >> "$RUNNER_TEMP/web-tsc.txt" 2>&1
          app=$?
          pnpm exec tsc --noEmit -p tsconfig.node.json --pretty false >> "$RUNNER_TEMP/web-tsc.txt" 2>&1
          node_status=$?
          cat "$RUNNER_TEMP/web-tsc.txt"
          if [ "$app" -ne 0 ] || [ "$node_status" -ne 0 ]; then
            exit 1
          fi

      - name: Typecheck baseline
        if: always()
        run: node .github/scripts/ci-baseline-gate.mjs tsc "$RUNNER_TEMP/web-tsc.txt" 728

  web-test:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:run

  # Node 24 matches the API runtime in release.yml. pnpm version comes from
  # package.json packageManager; do not pass a version input to action-setup.
  api-contracts:
    name: API & contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API tests, contracts, and typecheck
        run: pnpm test:api && pnpm test:contracts && pnpm type-check:api

  # Node's built-in test runner only. No pnpm install: the readiness checker
  # and its tests use node:test, node:fs, and fetch. Runs on pull requests
  # and on pushes to main, same as the jobs above.
  release-readiness:
    name: Release readiness script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API readiness checker
        run: node --test .github/scripts/verify-api-readiness.test.mjs .github/scripts/ci-baseline-gate.test.mjs scripts/upload-api-sourcemaps.test.mjs
      - name: Web source map upload checker
        run: node --test scripts/upload-web-sourcemaps.test.mjs

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      # Typecheck and Jest fail this job directly. Lint prints the report,
      # then the baseline step fails the job when mobile eslint errors or
      # warnings rise above .github/lint-baseline.json (key "mobile").
      # Lower that JSON after a real cleanup.
      - name: Lint
        run: |
          set +e
          npm run lint > "$RUNNER_TEMP/mobile-lint.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/mobile-lint.txt"
          echo "$status" > "$RUNNER_TEMP/mobile-lint.exit"
          exit 0

      - name: Lint baseline
        if: always()
        run: node "$GITHUB_WORKSPACE/.github/scripts/ci-baseline-gate.mjs" eslint "$RUNNER_TEMP/mobile-lint.txt" "$GITHUB_WORKSPACE/.github/lint-baseline.json" mobile "$(cat "$RUNNER_TEMP/mobile-lint.exit")"

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Test
        run: npm test -- --ci --watchAll=false

      - name: Export iOS bundle
        env:
          EXPO_NO_TELEMETRY: '1'
          # EAS builds upload source maps only when SENTRY_AUTH_TOKEN is set.
          # This export must stay a local bundle.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-ios"
