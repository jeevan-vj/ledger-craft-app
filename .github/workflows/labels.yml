name: Sync labels

# Creates and updates labels from .github/labels.yml.
# skip-delete leaves labels that are not in the file.
# Pull requests do not run this, so a fork cannot rewrite repository labels.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-labels
  cancel-in-progress: true

jobs:
  sync:
    name: Sync repository labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # crazy-max/ghaction-github-labeler v6.0.0
      # 548a7c3603594ec17c819e1239f281a3b801ab4d
      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: true
