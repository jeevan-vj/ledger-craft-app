name: CI

# Pull requests and pushes to main. Separate from "Build and Test"
# (.github/workflows/deploy-only.yml), which still runs the Postgres API suite.
# This workflow does not start Postgres, deploy, or read production secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-lint:
    name: Web lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No `version:` input. package.json packageManager is pnpm@11.19.0.
      # Pinning a version (the old workflow pinned 9) makes pnpm/action-setup
      # fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # TODO: web `eslint .` is not clean (baseline 468 errors, 112 warnings,
      # recorded 2026-10-17). Mostly @typescript-eslint/no-explicit-any.
      # The step keeps running so the log is the report. The gate fails the
      # job only when the error count rises. Do not blanket-ignore rules.
      - name: Lint
        continue-on-error: true
        run: |
          set +e
          pnpm lint > "$RUNNER_TEMP/web-lint.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/web-lint.txt"
          exit $status

      - name: Lint baseline
        if: always()
        run: node .github/scripts/ci-baseline-gate.mjs eslint "$RUNNER_TEMP/web-lint.txt" 468

  web-typecheck:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Root `tsc --noEmit` checks nothing: tsconfig.json has `"files": []`
      # and no `--build`. Check the Vite app and the Node config instead.
      # TODO: tsconfig.app.json is not clean (baseline 728 errors, recorded
      # 2026-10-17). tsconfig.node.json is clean and still runs when the app
      # project fails. Mostly query-builder calls on the Supabase stub
      # (TS2554 / TS2349) in src/services.
      - name: Typecheck
        continue-on-error: true
        run: |
          set +e
          : > "$RUNNER_TEMP/web-tsc.txt"
          pnpm exec tsc --noEmit -p tsconfig.app.json --pretty false >> "$RUNNER_TEMP/web-tsc.txt" 2>&1
          app=$?
          pnpm exec tsc --noEmit -p tsconfig.node.json --pretty false >> "$RUNNER_TEMP/web-tsc.txt" 2>&1
          node_status=$?
          cat "$RUNNER_TEMP/web-tsc.txt"
          if [ "$app" -ne 0 ] || [ "$node_status" -ne 0 ]; then
            exit 1
          fi

      - name: Typecheck baseline
        if: always()
        run: node .github/scripts/ci-baseline-gate.mjs tsc "$RUNNER_TEMP/web-tsc.txt" 728

  web-test:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:run

  # Node's built-in test runner only. No pnpm install: the readiness checker
  # and its tests use node:test, node:fs, and fetch. Runs on pull requests
  # and on pushes to main, same as the jobs above.
  release-readiness:
    name: Release readiness script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API readiness checker
        run: node --test .github/scripts/verify-api-readiness.test.mjs
      - name: Web source map upload checker
        run: node --test scripts/upload-web-sourcemaps.test.mjs

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      # TODO: eslint-config-expo flat config. Baseline 5 errors and 100
      # warnings (2026-10-17): unresolved @testing-library/react-native (2)
      # and @react-navigation/stack (1), plus react/no-unescaped-entities (2).
      - name: Lint
        continue-on-error: true
        run: |
          set +e
          npm run lint > "$RUNNER_TEMP/mobile-lint.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/mobile-lint.txt"
          exit $status

      # TODO: `tsc --noEmit` baseline is 444 errors (2026-10-17). Largest
      # buckets are TS2304 cannot find name, TS2582 missing Jest types,
      # TS2554 wrong arity, and TS2339 missing properties. Tests stay in the
      # program; this does not exclude them.
      - name: Typecheck
        continue-on-error: true
        run: |
          set +e
          npx tsc --noEmit --pretty false > "$RUNNER_TEMP/mobile-tsc.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/mobile-tsc.txt"
          exit $status

      # jest.setup.js restores Expo winter globals before the suite reads
      # them. Jest 30 otherwise rejects that lazy require. The suite runs;
      # 12 tests still fail because ItemService and BusinessProfileService
      # throw "User not authenticated".
      - name: Test
        continue-on-error: true
        run: |
          set +e
          npm test -- --ci --watchAll=false > "$RUNNER_TEMP/mobile-jest.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/mobile-jest.txt"
          exit $status

      - name: Export iOS bundle
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-ios"

      - name: Baseline gates
        if: always()
        run: |
          status=0
          node "$GITHUB_WORKSPACE/.github/scripts/ci-baseline-gate.mjs" eslint "$RUNNER_TEMP/mobile-lint.txt" 5 || status=1
          node "$GITHUB_WORKSPACE/.github/scripts/ci-baseline-gate.mjs" tsc "$RUNNER_TEMP/mobile-tsc.txt" 444 || status=1
          node "$GITHUB_WORKSPACE/.github/scripts/ci-baseline-gate.mjs" jest "$RUNNER_TEMP/mobile-jest.txt" 12 || status=1
          exit $status
