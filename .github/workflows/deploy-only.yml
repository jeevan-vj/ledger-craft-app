name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Start Postgres
        run: docker compose up -d --wait

      - name: Contract tests
        run: pnpm test:contracts

      - name: API integration and RLS tests
        run: pnpm test:api
        env:
          DATABASE_URL: postgres://ledgercraft_app:app@127.0.0.1:55432/ledgercraft
          DATABASE_MIGRATE_URL: postgres://ledgercraft_migrator:migrator@127.0.0.1:55432/ledgercraft
          DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:55432/ledgercraft
          NODE_ENV: test

      - name: API and contracts typecheck
        run: pnpm type-check:api

      - name: Web unit tests
        run: pnpm test:run

      - name: Generate version info
        run: pnpm run prebuild

      - name: Build web application
        run: pnpm run build
