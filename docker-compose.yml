services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgercraft
    ports:
      - '55432:5432'
    volumes:
      - ledgercraft_pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ledgercraft']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  ledgercraft_pg:
